<!DOCTYPE html>

<head>

  <title>全站知识库与文档 · 管理端</title>
  <link rel="stylesheet" href="/static/style.css?v=20260817" />

</head>
<body data-portal="admin" data-page="admin-docs" class="gpt-subpage" data-admin-nav="docs">
  <div class="gpt-layout">
    <aside class="gpt-sidebar gpt-sidebar-admin" id="gptSidebar">
      <div class="gpt-sidebar-head gpt-sidebar-head-bar">
        <div class="gpt-sidebar-head-primary">
          <a href="/admin/hub.html" class="gpt-btn-newchat" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:0.35rem;"><span class="gpt-icon">⌂</span><span class="gpt-sidebar-btn-text">管理首页</span></a>
          <button type="button" class="gpt-btn-newchat gpt-sidebar-expand-btn" id="btnSidebarExpand" aria-label="展开侧栏">
            <span class="gpt-icon" aria-hidden="true">⟩</span><span class="gpt-sidebar-btn-text">展开侧栏</span>
          </button>
        </div>
        <button type="button" class="gpt-sidebar-rail-corner" id="btnSidebarRailToggle" aria-label="收起侧栏文字" title="收起文字仅保留图标">⟨</button>
      </div>
            <nav class="gpt-sidebar-nav" id="adminNavMount" aria-label="管理功能"></nav>
<div class="gpt-sidebar-foot gpt-sidebar-foot-stack"><div class="gpt-sidebar-user-row"><div class="gpt-user-menu gpt-user-menu-sidebar" id="userMenu"><button type="button" class="gpt-avatar-btn gpt-avatar-btn-sidebar" id="avatarBtn"><img id="avatarImg" alt="" width="32" height="32" hidden /><span id="avatarFallback">管</span></button><div class="gpt-user-dropdown" id="userDropdown" role="menu"><button type="button" class="gpt-dropdown-item" data-menu="account" role="menuitem"><span class="gpt-dropdown-ico">◎</span>账户</button><button type="button" class="gpt-dropdown-item" data-menu="appearance" role="menuitem"><span class="gpt-dropdown-ico">◐</span>外观</button><button type="button" class="gpt-dropdown-item" data-menu="help" role="menuitem"><span class="gpt-dropdown-ico">?</span>帮助</button><button type="button" class="gpt-dropdown-item gpt-dropdown-danger" data-menu="logout" role="menuitem"><span class="gpt-dropdown-ico">→</span>退出登录</button></div></div></div><div class="gpt-sidebar-foot-links"><a class="gpt-foot-link" href="/" rel="noopener">用户前台</a><a class="gpt-foot-link" href="/admin/api-docs.html">API 规范（Swagger）</a></div></div>
    </aside>
    <div class="gpt-backdrop" id="gptBackdrop" hidden aria-hidden="true"></div>
    <div class="gpt-main gpt-main-subpage">
      <header class="gpt-topbar"><button type="button" class="gpt-menu-mobile" id="btnSidebarToggle" aria-label="打开菜单">☰</button>        <div class="gpt-topbar-title"><span id="topbarTitle">全站知识库与文档</span><span class="gpt-topbar-sub" id="topbarSub"></span></div><div class="gpt-topbar-actions"><a href="/admin/hub.html" class="gpt-btn-text" style="text-decoration:none;">返回调控中心</a></div></header>
      <div class="gpt-subpage-inner"><div class="gpt-subpage-card"><div class="gpt-dlg-body" id="adminDocsPageRoot">
        <div class="gpt-tabs" role="tablist">
          <button type="button" class="gpt-tab active" data-tab="kb-catalog">全站知识库</button>
          <button type="button" class="gpt-tab" data-tab="doc-list">全站文档</button>
        </div>
        <section class="gpt-tab-panel active" id="panel-kb-catalog" aria-label="全站知识库">
          <p class="gpt-muted" style="margin:0.75rem 0">展示各用户知识库（分类）及文档数；禁用后用户无法向该库上传且检索不包含该库文档。强制处理将库内文档全部移入回收站（可后续在 <a href="/admin/trash.html">文档回收站</a> 清空或恢复）。</p>
          <div class="gpt-admin-toolbar">
            <button type="button" class="gpt-btn-sm" id="btnAdmKbCatalogRefresh">刷新列表</button>
          </div>
          <div id="adminKbCatalogList"></div>
        </section>
        <section class="gpt-tab-panel" id="panel-doc-list" aria-label="全站文档">
        <p class="gpt-muted" style="margin:0.75rem 0">仅列出<strong>有效</strong>文档；删除将移入 <a href="/admin/trash.html">文档回收站</a>。</p>
        <div class="gpt-admin-toolbar">
          <select id="admDocUserFilter" class="gpt-input"><option value="">全部用户</option></select>
          <button type="button" class="gpt-btn-sm" id="btnAdmDocRefresh">刷新</button>
        </div>
        <div id="adminDocsList"></div>
        </section>
      </div></div></div>
    </div>
  </div>
  <div id="toastHost" class="gpt-toast-host" aria-live="polite"></div>
  <dialog class="gpt-dialog" id="dlgProfile"><div class="gpt-dlg-head"><h2>账户</h2><button type="button" class="gpt-dlg-close" data-close-dlg="dlgProfile">×</button></div><div class="gpt-dlg-body"><p class="gpt-muted">登录账号：<strong id="profileUsername">—</strong></p><label>昵称</label><input type="text" id="profileNickname" class="gpt-input" maxlength="32" /><div class="gpt-row gpt-row-end"><button type="button" class="gpt-btn-primary" id="btnProfileSave">保存</button></div><p class="gpt-log" id="profileMsg" hidden></p></div></dialog>
  <dialog class="gpt-dialog" id="dlgHelp"><div class="gpt-dlg-head"><h2>帮助</h2><button type="button" class="gpt-dlg-close" data-close-dlg="dlgHelp">×</button></div><div class="gpt-dlg-body gpt-help-body"><p>知识库目录与有效文档在此维护；回收站请打开侧栏「文档回收站」。</p></div></dialog>
  <dialog class="gpt-dialog" id="dlgRename"><form method="dialog" class="gpt-rename-form" id="formRename"><h3>重命名对话</h3><input type="text" id="renameInput" class="gpt-input" required maxlength="64" /><div class="gpt-row gpt-row-end"><button type="button" class="gpt-btn-text" id="renameCancel">取消</button><button type="submit" class="gpt-btn-primary" id="renameOk">保存</button></div></form></dialog>
    <script src="/static/admin-nav.js?v=20260817"></script>
  <script>mountAdminNav(document.body.getAttribute("data-admin-nav") || "");</script>
  <script src="/static/app.js?v=20260817"></script>
</body>
</html>
